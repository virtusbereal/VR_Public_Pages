    font-size: 14px;
    color: #4b5563;
  }
  .btn {
    margin-top: 20px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 4px 20px 2px;
    border: none;
    border-radius: 2px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);

  }

    background: #1d4ed8;
  }
  .btn-blue:focus-visible {

    box-shadow: 0 0 0 3px #dbeafe;
  }
  .corner {
    display: flex;
    justify-content: flex-end;
    padding: 8px 16px;
  }
  #themeToggle {
    cursor: pointer;
    color: #87d4d7;
    background: none;
    border: none;
    padding: 4px;
    line-height: 0;
  }
  #themeToggle:hover {
    color: #487476;
  }
  #themeToggle svg { display: none; }
  #themeToggle.is-dark svg.icon-bulb { display: block; }
  #themeToggle:not(.is-dark) svg.icon-bulb-off { display: block; }
  footer {
    background: #4b5563;
    color: #ffffff;
    text-align: center;
    font-size: 10px;
    padding: 4px 24px;
  }

  html.dark body { background: #000000; color: #d1d5db; }
  html.dark .card {
    background: #000000;
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 6px -1px rgba(255, 255, 255, 0.15), 0 2px 4px -2px rgba(255, 255, 255, 0.15);
  }
  html.dark .icon { color: #f87171; }
  html.dark h1 { color: #94e8eb; }
  html.dark p { color: #9ca3af; }
  html.dark .btn-blue { color: #111827; background: #60a5fa; }
  html.dark .btn-blue:hover { background: #93c5fd; }
  html.dark .btn-blue:focus-visible { box-shadow: 0 0 0 3px #1e3a8a; }
  html.dark #themeToggle { color: #94e8eb; }
  html.dark #themeToggle:hover { color: #94e8eb; }

  <script>
    (function () {
      var stored = null;
      try { stored = window.localStorage.getItem('visualModePreference'); } catch (e) {}
      var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var root = document.documentElement;
      var toggle = document.getElementById('themeToggle');
      function apply (dark) {
        root.classList.toggle('dark', dark);
        toggle.classList.toggle('is-dark', dark);
      }
      apply(isDark);
      toggle.addEventListener('click', function () {
        var next = !root.classList.contains('dark');
        apply(next);
        try { window.localStorage.setItem('visualModePreference', next ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>
